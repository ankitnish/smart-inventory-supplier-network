services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"], interval: 5s, retries: 10 }
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  ml-service:
    build: ./ml-service
    ports: ["8000:8000"]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ML_SERVICE_URL: http://ml-service:8000
      REDIS_URL: redis://redis:6379
    depends_on: { postgres: { condition: service_healthy }, ml-service: { condition: service_started } }
    ports: ["4000:4000"]
  # frontend: added in Phase 1b/7 (Next.js app)
volumes: { pgdata: {} }
